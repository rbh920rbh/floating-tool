name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Configure sideload signing
        run: |
          cp ci/android/floating-tool-sideload.jks app/floating-tool-sideload.jks
          cat > key.properties <<'EOF'
          storePassword=floating-tool-sideload
          keyPassword=floating-tool-sideload
          keyAlias=floatingtool
          storeFile=floating-tool-sideload.jks
          EOF

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-tool-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
